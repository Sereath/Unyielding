##########################################################################################################
# status_effects
#--------------------------------------------------------------------------------------------------------#
# Status Effects
##########################################################################################################

status_effects {
    # If local number of Revenants is higher than this, effect will not spawn new mobs. [range: 0 ~ 100, default: 30]
    I:"Anathema Mobcap"=30

    # Chance to change damage to ignore armor, affected by amplifier (*). [range: 0.0 ~ 100.0, default: 0.07]
    S:"Bane Value"=0.07

    # How much damage you will not be doing under this effect, affected by amplifier (*). [range: 0.0 ~ 100.0, default: 0.07]
    S:"Rotten Value"=0.07

    # How much damage you will get under this effect, affected by amplifier and number of active effects (*). [range: 0 ~ 100, default: 3]
    I:"Stack Value"=3

    # Exp this effect will remove from you when killing mobs, affected by amplifier (*). [range: 0 ~ 100, default: 3]
    I:"Vampyri Value"=3
}


